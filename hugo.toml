baseURL = "https://go-xslt.github.io/"
languageCode = "en-us"
title = "go-xslt"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.95:1, bright on the dark background 3.39:1.
  base = "#4c1d95"
  deep = "#2e125b"
  bright = "#7c3aed"
  shadow = "rgba(76,29,149,.7)"
  glow = "rgba(76,29,149,.6)"
  wash = "rgba(76,29,149,.10)"
  washDeep = "rgba(46,18,91,.06)"
  chipBg = "#efe7fd"
  chipBorder = "#d8c4fa"
  chipFg = "#2e125b"
  chipBgDark = "rgba(124,58,237,.14)"
  chipBorderDark = "rgba(124,58,237,.32)"
  chipFgDark = "#b793f5"
  statsEnd = "#e0d0fb"
  bandText = "#eadffc"
  accent = "#4c1d95"
  accentDark = "#915af0"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-xslt.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-xslt"
  label = "GitHub"
